packages:
  - apps/*
  - packages/*

allowBuilds:
  '@railway/cli': true
  '@sentry/cli': false
  esbuild: true
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true

catalog:
  '@aws-sdk/client-s3': 3.1094.0
  '@aws-sdk/s3-request-presigner': 3.1094.0
  '@better-auth/drizzle-adapter': 1.6.25
  '@base-ui/react': 1.6.0
  '@opentelemetry/api': 1.9.1
  '@sentry/nextjs': 10.68.0
  '@tailwindcss/postcss': 4.3.3
  '@testing-library/jest-dom': 7.0.0
  '@testing-library/react': 16.3.2
  '@types/node': 24.13.3
  '@types/nodemailer': 8.0.1
  '@types/pg': 8.20.0
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  bullmq: 5.81.1
  better-auth: 1.6.25
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dotenv: 17.4.2
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  ioredis: 5.11.1
  jsdom: 29.1.1
  lucide-react: 1.26.0
  next: 16.2.11
  nodemailer: 9.0.3
  pg: 8.22.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  prom-client: 15.1.3
  react: 19.2.8
  react-dom: 19.2.8
  resend: 6.18.0
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  tsx: 4.23.1
  uuid: 14.0.1
  zod: 4.4.3

disallowWorkspaceCycles: true
failIfNoMatch: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1094.0'
  - '@aws-sdk/s3-request-presigner@3.1094.0'
  - '@sentry/browser-utils@10.68.0'
  - '@sentry/browser@10.68.0'
  - '@sentry/core@10.68.0'
  - '@sentry/feedback@10.68.0'
  - '@sentry/nextjs@10.68.0'
  - '@sentry/node-core@10.68.0'
  - '@sentry/node@10.68.0'
  - '@sentry/opentelemetry@10.68.0'
  - '@sentry/react@10.68.0'
  - '@sentry/replay-canvas@10.68.0'
  - '@sentry/replay@10.68.0'
  - '@sentry/server-utils@10.68.0'
  - '@sentry/vercel-edge@10.68.0'
  - bullmq@5.81.1
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true
